name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rebuild seeded data export
        env:
          VALIDATE_SOURCE_URLS: "false"
        run: python3 scripts/seed_db.py

      - name: Verify committed export is up to date
        run: git diff --exit-code -- src/data/unified_data.json

      - name: Run seed pipeline regression tests
        run: python3 -m unittest discover -s tests

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
